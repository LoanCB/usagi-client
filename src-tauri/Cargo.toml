[package]
name = "Bunly"
version = "0.1.0"
description = "Bunly"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bunly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Verified by compilation, not from memory: argon2 has no stable 0.6 (release
# candidates only), and x25519-dalek 3.0 gates StaticSecret behind a feature.
# `zeroize` is explicit because neither crate enables it by default: argon2 then
# #[cfg]s out the scrubbing of its 64 MiB internal state (which holds a hash
# taken directly over the password), and chacha20poly1305 gates its Drop body on
# the feature, leaving a copy of every key handed to seal/open in the dropped
# cipher. The module's manual .zeroize() calls only reach the caller's copy.
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
bip39 = "2.2.2"
zeroize = { version = "1.9.0", features = ["derive"] }
getrandom = "0.4.3"
base64 = "0.22"
hex = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
url = "2"
semver = "1"

